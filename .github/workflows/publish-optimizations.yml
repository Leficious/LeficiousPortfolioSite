name: Publish optimization commit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply verified optimization patch
        shell: bash
        run: |
          echo '' | base64 --decode | gunzip > /tmp/optimization.patch
          git apply --index /tmp/optimization.patch
          git rm .github/workflows/publish-optimizations.yml
          git config user.name 'Leficious'
          git config user.email '161801062+Leficious@users.noreply.github.com'
          git commit -m 'Optimize portfolio UX, accessibility, and SEO'
          git push origin HEAD:main
